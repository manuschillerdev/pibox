name: Publish Pibox images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  base:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/manuschillerdev/pibox-base
          tags: |
            type=raw,value=bookworm
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: images/base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  gondolin:
    needs: base
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y cpio e2fsprogs lz4 podman
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin
      - run: npx gondolin build --config "images/gondolin/${{ matrix.arch }}.json" --output "dist/pibox-gondolin-${{ matrix.arch }}"
      - run: npx gondolin build --verify "dist/pibox-gondolin-${{ matrix.arch }}"
      - run: tar -C dist -czf "dist/pibox-gondolin-${{ matrix.arch }}.tar.gz" "pibox-gondolin-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: pibox-gondolin-${{ matrix.arch }}
          path: dist/pibox-gondolin-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: gondolin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pibox-gondolin-*
          merge-multiple: true
          path: dist
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
