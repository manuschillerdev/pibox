provider = "microsandbox"

[pibox]
name = "pibox-microsandbox-full-stack"
nameSuffix = "worktree"
workdir = "/workspace"

[caches.pnpm]
scope = "repository"

[caches.maven]
scope = "user"

[caches.mise]
scope = "user"

[sandbox]
image = "ghcr.io/manuschillerdev/pibox-base:bookworm"
ephemeral = true
replace = true
cpus = 4
memory = 8192
port = [[3000, 3000], [8080, 8080], [5432, 5432]]
volume = [["/workspace", { bind = ".", quota = 8192, statVirtualization = "relaxed", hostPermissions = "mirror" }]]
