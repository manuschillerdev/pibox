quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:pibox}
quarkus.datasource.password=${POSTGRES_PASSWORD:pibox}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/pibox}
quarkus.hibernate-orm.schema-management.strategy=update
